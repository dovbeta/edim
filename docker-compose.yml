version: "3.9"

services:

  api:
    build: ./services/api
    container_name: copilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - mongo
      - redis
    volumes:
      - ./services/api/app:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15
    container_name: copilot-postgres
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: copilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: copilot-redis
    ports:
      - "6379:6379"

  telegram-bot:
    build: ./services/telegram-bot
    container_name: copilot-telegram
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      COPILOT_API_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./services/telegram-bot:/bot
    command: watchmedo auto-restart --patterns="*.py" --recursive -- python bot.py

volumes:
  postgres_data:
  mongo_data:
